<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Guitar Flash Bot</title>
<link rel="icon" href="icons/icon32.png">
<style>
  :root { --bg:#111115; --panel:#1a1a20; --line:#2a2a33; --fg:#ececf1; --muted:#9a9aa8; --ok:#2fbf71; --bad:#e5534b; --warn:#e3b341; --accent:#4c8dff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display:flex; align-items:center; gap:12px; padding:20px 24px; border-bottom:1px solid var(--line); }
  header img { width:36px; height:36px; }
  header h1 { margin:0; font-size:20px; }
  header .sub { color:var(--muted); font-size:13px; }
  main { padding:20px 24px 40px; max-width:1400px; margin:0 auto; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:12px; margin-bottom:18px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .card .k { color:var(--muted); font-size:12px; }
  .card .v { font-size:24px; font-weight:700; margin-top:4px; font-variant-numeric:tabular-nums; }
  .bar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:12px; }
  .bar input { flex:1; min-width:200px; padding:9px 12px; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--fg); font:inherit; }
  .bar button { padding:9px 14px; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--fg); font:inherit; cursor:pointer; }
  .bar button:hover { border-color:var(--accent); }
  .bar button.danger:hover { border-color:var(--bad); color:var(--bad); }
  .tablewrap { overflow-x:auto; border:1px solid var(--line); border-radius:12px; }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  th, td { padding:9px 12px; text-align:left; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { background:var(--panel); color:var(--muted); font-weight:600; font-size:12px; position:sticky; top:0; cursor:pointer; user-select:none; }
  th.num, td.num { text-align:right; }
  tr:last-child td { border-bottom:0; }
  tbody tr:hover { background:#18181e; }
  .song b { display:block; }
  .song span { color:var(--muted); font-size:12px; }
  .pill { display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; font-weight:600; }
  .pill.ok { background:rgba(47,191,113,.15); color:var(--ok); }
  .pill.bad { background:rgba(229,83,75,.15); color:var(--bad); }
  .pct100 { color:var(--ok); font-weight:700; }
  .empty { padding:40px; text-align:center; color:var(--muted); }
  footer { text-align:center; color:var(--muted); font-size:12px; padding:20px; }
  footer b { color:var(--fg); }
</style>
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="">
    <div><h1 id="h-title">History</h1><div class="sub" id="h-sub">Guitar Flash Bot</div></div>
  </header>
  <main>
    <div class="cards" id="cards"></div>
    <div class="bar">
      <input id="filter" type="search">
      <button id="csv">CSV</button>
      <button id="json">JSON</button>
      <button id="clear" class="danger">Clear</button>
    </div>
    <div class="tablewrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
  </main>
  <footer id="credit"></footer>
  <script src="history.js"></script>
</body>
</html>
