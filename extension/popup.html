<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --bg:#16161a; --fg:#f2f2f2; --muted:#9a9aa5; --on:#1f9d55; --off:#c0392b; --line:#2a2a31; }
  body { margin:0; width:290px; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui, sans-serif; }
  .wrap { padding:16px; }
  h1 { display:flex; align-items:center; gap:8px; margin:0 0 12px; font-size:15px; }
  h1 img { width:24px; height:24px; }
  button { width:100%; border:0; border-radius:10px; color:#fff; cursor:pointer; font-family:inherit; }
  #toggle { padding:14px; font-size:18px; font-weight:700; }
  #toggle.start { background:var(--on); }
  #toggle.stop { background:var(--off); }
  #history { margin-top:10px; padding:9px; font-size:13px; background:#26262d; }
  #history:hover { background:#30303a; }
  .status { margin-top:12px; color:var(--muted); font-size:13px; min-height:54px; }
  .status b { color:var(--fg); }
  .warn { margin-top:12px; padding:10px; border-radius:10px; background:#3a2a10; border:1px solid #a8741a; color:#ffd58a; font-size:12px; line-height:1.45; }
  .warn b { color:#fff; }
  .hint { margin-top:10px; font-size:12px; color:var(--muted); }
  footer { margin-top:12px; padding-top:10px; border-top:1px solid var(--line); font-size:11px; color:var(--muted); text-align:center; }
  footer b { color:var(--fg); }
</style>
</head>
<body>
  <div class="wrap">
    <h1><img src="icons/icon48.png" alt=""><span id="title">Guitar Flash Bot</span></h1>
    <button id="toggle" class="start">START</button>
    <div class="status" id="status"></div>
    <div class="warn" id="warn" hidden></div>
    <button id="history">History</button>
    <div class="hint" id="hint"></div>
    <div class="hint" id="rank"></div>
    <footer id="credit">Developed by <b>pwn3ed</b></footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
